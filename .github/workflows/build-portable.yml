name: Build AppImages

on:
  push:
    branches: ["main"]
    tags:
      - "[0-9]*"
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        variant: [GenericMotif, IRIX] # Run both configurations side-by-side

    steps:
      - uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libfuse2 build-essential wget \
            libx11-dev libxt-dev libxmu-dev libxpm-dev \
            x11proto-dev libxext-dev xutils-dev x11proto-core-dev \
            libmotif-dev libxrandr2 libxrandr-dev

      - name: Setup Legacy X11 Print Header Stub
        run: sudo mkdir -p /usr/include/X11/extensions && sudo cp include/Print.h /usr/include/X11/extensions/

      - name: Install MaXX Ecosystem Dependencies (MaXX Variant Only)
        if: matrix.variant == 'IRIX'
        run: |
          wget -c https://s3.ca-central-1.amazonaws.com/cdn.maxxinteractive.com/maxx-desktop-installer/MaXX-Desktop-v2.2.0-LINUX-x86_64-tar.gz
          sudo tar -xzf MaXX-Desktop-v2.2.0-LINUX-x86_64-tar.gz -C /opt

      - name: Compile and Bundle AppImage
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          chmod +x ./shortcuts.sh
          ./shortcuts.sh appimage

      - name: Upload Finished Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MotifDesigner-${{ matrix.variant }}
          path: MotifDesigner-${{ matrix.variant }}-x86_64.AppImage
          if-no-files-found: error
          compression-level: 0

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create Release Draft and Upload AppImages
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: "MotifDesigner ${{ github.ref_name }}"
          files: artifacts/**/*.AppImage
# sudo mkdir -p /usr/include/X11/extensions && sudo cp include/Print.h /usr/include/X11/extensions/
